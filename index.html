<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Webcam Classifier | Teachable Machine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(20, 27, 45, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #a855f7 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Prompt', 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(79, 172, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(168, 85, 247, 0.15) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(79, 172, 254, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            margin-bottom: 12px;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 24px; }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #eab308;
            box-shadow: 0 0 8px #eab308;
        }

        .status-dot.ready {
            background-color: #22c55e;
            box-shadow: 0 0 10px #22c55e;
        }

        .btn-start {
            background: var(--accent-gradient);
            color: #fff;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
            margin-bottom: 20px;
        }

        .btn-start:hover { opacity: 0.9; transform: translateY(-2px); }
        .btn-start:active { transform: translateY(0); }

        #webcam-container {
            display: none;
            margin: 0 auto 20px auto;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            width: fit-content;
            background: #000;
        }

        #webcam-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
            max-height: 280px;
        }

        #label-container {
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .result-item.top-match {
            background: rgba(56, 189, 248, 0.1);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .result-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 0.95rem; font-weight: 600; }
        .result-percent { color: #38bdf8; }
        .progress-bg { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 999px; overflow: hidden; }
        .progress-fill { height: 100%; width: 0%; background: var(--accent-gradient); transition: width 0.2s ease; }
    </style>
</head>
<body>

    <div class="container">
        <span class="badge">AI Real-time Vision</span>
        <h1>Webcam Classifier</h1>
        <p class="subtitle">เปิดกล้องเพื่อAIจำแนกวัตถุแบบเรียลไทม์</p>

        <div class="status-bar">
            <div class="status-dot" id="status-dot"></div>
            <span id="status-text">กำลังโหลดโมเดล AI...</span>
        </div>

        <button type="button" class="btn-start" id="btn-start" onclick="init()" disabled>เริ่มใช้งานกล้อง</button>

        <div id="webcam-container"></div>

        <div id="label-container"></div>
    </div>

    <script type="text/javascript">
        const URL = "https://teachablemachine.withgoogle.com/models/P_BOr7QqK/";

        let model, webcam, labelContainer, maxPredictions;

        const statusDot = document.getElementById("status-dot");
        const statusText = document.getElementById("status-text");
        const btnStart = document.getElementById("btn-start");
        const webcamContainer = document.getElementById("webcam-container");
        const labelContainer = document.getElementById("label-container");

        async function loadModel() {
            try {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                statusDot.classList.add("ready");
                statusText.innerText = "โมเดลพร้อมใช้งานแล้ว";
                btnStart.removeAttribute("disabled");

                // สร้างช่องแสดงผลเปอร์เซ็นต์รอล่วงหน้า
                for (let i = 0; i < maxPredictions; i++) {
                    const resultItem = document.createElement("div");
                    resultItem.className = "result-item";
                    resultItem.innerHTML = `
                        <div class="result-header">
                            <span class="class-name">Loading...</span>
                            <span class="result-percent">0.0%</span>
                        </div>
                        <div class="progress-bg">
                            <div class="progress-fill" style="width: 0%"></div>
                        </div>
                    `;
                    labelContainer.appendChild(resultItem);
                }
            } catch (error) {
                console.error(error);
                statusText.innerText = "โหลดโมเดลไม่สำเร็จ (โปรดตรวจสอบลิงก์ URL)";
                statusDot.style.backgroundColor = "#ef4444";
            }
        }

        loadModel();

        async function init() {
            btnStart.style.display = "none";
            webcamContainer.style.display = "block";

            const flip = true; 
            webcam = new tmImage.Webcam(250, 250, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            webcamContainer.appendChild(webcam.canvas);
        }

        async function loop() {
            webcam.update(); 
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            prediction.sort((a, b) => b.probability - a.probability);

            for (let i = 0; i < maxPredictions; i++) {
                const item = prediction[i];
                const percentage = (item.probability * 100).toFixed(1);
                const isTopMatch = i === 0 && item.probability > 0.5;

                const resultItem = labelContainer.children[i];
                resultItem.className = `result-item ${isTopMatch ? "top-match" : ""}`;
                
                resultItem.querySelector(".class-name").innerText = item.className;
                resultItem.querySelector(".result-percent").innerText = `${percentage}%`;
                resultItem.querySelector(".progress-fill").style.width = `${percentage}%`;
            }
        }
    </script>
</body>
</html>
