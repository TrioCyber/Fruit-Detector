<div>Teachable Machine Image Model</div>
<button type="button" onclick="init()">Start (Webcam)</button>
<br><br>
<!-- เพิ่มส่วนปุ่มอัปโหลดรูปภาพ -->
<input type="file" id="imageUpload" accept="image/*" onchange="uploadImage(event)">
<br><br>

<div id="webcam-container"></div>
<div id="image-container"></div>
<div id="label-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
<script type="text/javascript">
    // 👉 ใช้ลิงก์โมเดลออนไลน์จาก Teachable Machine ของคุณ (วางแทนที่ URL นี้ได้เลย)
    const URL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL_URL_HERE/";

    let model, webcam, labelContainer, maxPredictions;
    let uploadedImageElement = null;

    // Load the image model
    async function init() {
        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // Convenience function to setup a webcam
        const flip = true; // whether to flip the webcam
        webcam = new tmImage.Webcam(200, 200, flip); // width, height, flip
        await webcam.setup(); // request access to the webcam
        await webcam.play();
        window.requestAnimationFrame(loop);

        // append elements to the DOM
        document.getElementById("webcam-container").innerHTML = "";
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        
        labelContainer = document.getElementById("label-container");
        labelContainer.innerHTML = "";
        for (let i = 0; i < maxPredictions; i++) {
            labelContainer.appendChild(document.createElement("div"));
        }
    }

    async function loop() {
        webcam.update(); // update the webcam frame
        await predict(webcam.canvas);
        window.requestAnimationFrame(loop);
    }

    // ฟังก์ชันสำหรับอัปโหลดรูปภาพมาทายผลแทนกล้อง
    async function uploadImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        // ถ้าเปิดกล้องอยู่ ให้หยุดการทำงานลูปของกล้องชั่วคราว
        if (webcam) {
            try { webcam.stop(); } catch(e) {}
            document.getElementById("webcam-container").innerHTML = "";
        }

        const reader = new FileReader();
        reader.onload = async function (e) {
            if (!uploadedImageElement) {
                uploadedImageElement = document.createElement("img");
                uploadedImageElement.width = 200;
                uploadedImageElement.height = 200;
                document.getElementById("image-container").innerHTML = "";
                document.getElementById("image-container").appendChild(uploadedImageElement);
            }
            uploadedImageElement.src = e.target.result;

            // โหลดโมเดลถ้ายังไม่ได้โหลด
            if (!model) {
                const modelURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();
                
                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = "";
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
            }

            uploadedImageElement.onload = async function () {
                await predict(uploadedImageElement);
            }
        }
        reader.readAsDataURL(file);
    }

    // run image through the image model
    async function predict(inputElement) {
        if (!model) return;
        const prediction = await model.predict(inputElement);
        for (let i = 0; i < maxPredictions; i++) {
            const classPrediction =
                prediction[i].className + ": " + prediction[i].probability.toFixed(2);
            labelContainer.childNodes[i].innerHTML = classPrediction;
        }
    }
</script>
